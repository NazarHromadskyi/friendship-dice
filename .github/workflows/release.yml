name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update module.json with release URLs
        run: |
          jq \
            --arg ver "${{ steps.version.outputs.version }}" \
            --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
            --arg download "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.zip" \
            '.version = $ver | .manifest = $manifest | .download = $download' \
            module.json > module-release.json
          mv module-release.json module.json

      - name: Create module.zip
        run: |
          zip -r module.zip \
            module.json \
            scripts/ \
            styles/ \
            templates/ \
            lang/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true

      - name: Publish to Foundry VTT
        run: |
          curl -s -X POST \
            "https://api.foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}" \
            -d '{
              "id": "friendship-dice",
              "dry-run": false,
              "release": {
                "version": "${{ steps.version.outputs.version }}",
                "manifest": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/module.json",
                "notes": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
                "compatibility": {
                  "minimum": "13",
                  "verified": "13.341"
                }
              }
            }'
